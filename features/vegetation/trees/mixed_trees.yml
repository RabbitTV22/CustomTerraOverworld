id: MIXED_TREES
type: FEATURE
mask: &mask
  sampler:
    type: PROBABILITY
    sampler:
      type: DOMAIN_WARP
      amplitude: 10
      warp:
        type: GAUSSIAN
      sampler:
        type: FBM
        octaves: 2
        sampler:
          type: OPEN_SIMPLEX_2
          frequency: 0.01
          salt: 98341
  threshold: 0.4
distributor:
  type: SAMPLER
  sampler:
    type: POSITIVE_WHITE_NOISE
    salt: 1945
  threshold: 0.01

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: ${meta.yml:ocean-level} + 3
        max: $meta.yml:top-y
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:dry-plantable-blocks
        offset: -1
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks:
          - minecraft:snow
          - minecraft:air
        offset: 0

structures:
  distribution:
    type: CELLULAR
    return: CellValue
    frequency: 0.02
  structures:
    - blank: 15
    - oak_tree_procedural: 8
    - birch_tree_procedural: 2
    - spruce_tree_procedural: 1