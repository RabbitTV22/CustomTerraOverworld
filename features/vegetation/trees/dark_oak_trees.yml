id: DARK_OAK_TREES
type: FEATURE
mask: &mask
  sampler:
    type: PROBABILITY
    sampler:
      type: DOMAIN_WARP
      amplitude: 10
      warp:
        type: GAUSSIAN
      sampler:
        type: FBM
        octaves: 2
        sampler:
          type: OPEN_SIMPLEX_2
          frequency: 0.01
          salt: 98341
  threshold: 0.4
distributor:
  type: PADDED_GRID
  width: 30
  padding: 3
  salt: 9591

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: ${meta.yml:ocean-level} + 3
        max: $meta.yml:top-y
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:dry-plantable-blocks
        offset: -1
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks:
          - minecraft:snow
          - minecraft:air
        offset: 0

structures:
  distribution:
    type: CONSTANT
  structures:
    - large_dark_oak_tree_procedural: 3
    - dark_oak_tree_procedural: 1