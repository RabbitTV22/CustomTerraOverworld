id: BUSH
type: FEATURE

distributor:
  type: PADDED_GRID
  width: 20
  padding: 2
  salt: 1510

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: ${meta.yml:ocean-level} + 3
        max: ${meta.yml:ocean-level} + 119
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:dry-plantable-blocks
        offset: -1

structures:
  distribution:
    type: EXPRESSION
    expression: sampler(x, z) # Using this to ensure 2D sampler is used
    threshold: 0.8
    samplers:
      sampler:
        dimensions: 2
        type: LINEAR
        min: 0.1
        max: 0.6
        sampler:
          type: PROBABILITY
          sampler:
            type: DOMAIN_WARP
            amplitude: 3
            warp:
              type: GAUSSIAN
            sampler:
              type: FBM
              octaves: 2
              sampler:
                type: OPEN_SIMPLEX_2
                frequency: 10
                salt: 24365
  structures: bush