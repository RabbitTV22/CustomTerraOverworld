id: DRY_GRASS
type: FEATURE

distributor:
  type: PADDED_GRID
  width: 20
  padding: 5
  salt: 1510

locator:
  type: AND
  locators:
    - type: TOP
      range: &range
        min: ${meta.yml:ocean-level} + 3
        max: ${meta.yml:ocean-level} + 119
    - type: PATTERN
      range: *range
      pattern:
        type: MATCH_SET
        blocks: $features/vegetation/meta.yml:dry-plantable-blocks
        offset: -1

structures:
  distribution:
    type: CONSTANT
  structures: dry_grass